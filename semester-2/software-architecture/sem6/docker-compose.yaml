services:
  app:
    build: ./app
    ports:
      - "8000:8000"        # Доступен снаружи
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: notesdb
      DB_USER: postgres
      DB_PASS: postgres
    depends_on:
      - db
    networks:
      - mynetwork

  db:
    image: postgres:15
    expose:
      - "5432"             # Только внутри Docker-сети
    environment:
      POSTGRES_DB: notesdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mynetwork

networks:
  mynetwork:

volumes:
  pgdata:

